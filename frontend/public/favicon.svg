<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pranera Sample Pass: fabric swatch + gate pass tag -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26497a"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- swatch with pinked edge -->
  <path d="M20 26 l4-4 4 4 4-4 4 4 4-4 4 4 4-4 4 4 v34 l-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4 Z" fill="#ffffff"/>
  <g stroke="#c7d6ea" stroke-width="1.4" stroke-linecap="round">
    <line x1="26" y1="33" x2="46" y2="33"/><line x1="26" y1="40" x2="46" y2="40"/>
    <line x1="26" y1="47" x2="46" y2="47"/><line x1="26" y1="54" x2="46" y2="54"/>
  </g>
  <!-- pass tag -->
  <g transform="rotate(12 66 58)">
    <rect x="48" y="40" width="34" height="40" rx="5" fill="#f5b942"/>
    <circle cx="65" cy="47" r="3" fill="#16304f"/>
    <rect x="54" y="55" width="22" height="3.5" rx="1.5" fill="#16304f"/>
    <rect x="54" y="62" width="16" height="3.5" rx="1.5" fill="#16304f" opacity=".75"/>
    <path d="M56 71 l5 5 9-10" fill="none" stroke="#0f6e56" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
